<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Disk Library{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-6 py-3 flex items-center gap-6">
    <a href="{{ url_for('index') }}" class="flex items-center gap-2 text-lg font-semibold text-slate-900 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.7L5.737 5.1a3.375 3.375 0 0 1 2.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 0 1 .9 2.7m0 0a3 3 0 0 1-3 3m0 3h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Zm-3 6h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Z"/>
      </svg>
      <span>Disk Library</span>
    </a>
    <nav class="hidden md:flex items-center gap-1 text-sm">
      <a href="{{ url_for('library', type='movie') }}" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Movies</a>
      <a href="{{ url_for('library', type='series') }}" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Series</a>
      <a href="{{ url_for('scans_index') }}" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Scans</a>
      <a href="{{ url_for('duplicates') }}" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Duplicates</a>
      <a href="{{ url_for('jobs_index') }}" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Jobs</a>
    </nav>
    <form action="{{ url_for('search') }}" method="get" class="flex-1 max-w-xl">
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input type="text" name="q" value="{{ request.args.get('q','') }}"
               placeholder="Search files across all disks..."
               class="w-full pl-9 pr-4 py-2 text-sm rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
      </div>
    </form>
  </div>
</header>
<main class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
<footer class="bg-white border-t border-slate-200 text-xs text-slate-400">
  <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between">
    <span>disklib</span>
    <span class="mono">scan with: ./scandisk.py /path/to/mount "Disk Name"</span>
  </div>
</footer>
</body>
</html>
